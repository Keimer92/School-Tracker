name: Build and Release

# ── Se dispara al hacer push a `main`, NO al subir un tag ──
#
# Antes el trigger era `push: tags: 'v*'`, que obliga a subir un tag a mano y
# además se desincroniza de la app: la versión de `tauri.conf.json` nunca se
# comparaba con el tag, así que era posible publicar `v1.2.0` con una app que
# todavía decía `1.1.5`, sin que nada avisara.
#
# Ahora el push a `main` dispara el pipeline y el primer job decide:
#   · la versión de `tauri.conf.json` es IGUAL al último tag -> no hace nada
#   · es DISTINTA -> crea el tag, publica la release y compila
# Es decir, la release sigue al archivo, que es de donde sale el número que ve
# el usuario al instalar.
on:
  push:
    branches: [main]
  # Se conserva el disparo manual por tag para publicar un build exacto sin
  # esperar un push. El job `prepare` es idempotente: si el tag ya existe, lo
  # reutiliza en vez de fallar al volver a crearlo.
  workflow_dispatch:

# `softprops/action-gh-release` crea la release y sube los assets. Sin este
# permiso el paso falla en los repos donde el GITHUB_TOKEN por defecto es de
# solo lectura.
permissions:
  contents: write

# No se cancela una release a medio subir: dos builds escribiendo los mismos
# assets se pisan. `cancel-in-progress: false` deja que la primera termine.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Detecta el cambio de versión y crea el tag ──
  #
  # `ubuntu-24.04` FIJO, no `ubuntu-latest`: la etiqueta `latest` migra a Ubuntu
  # 26 durante octubre de 2026 y el toolchain de Android (NDK + CMake) cambia
  # con ella. Un build que hoy funciona puede empezar a fallar solo por la
  # migración de la imagen. Fijar la versión hace la compilación reproducible.
  #
  # Lo mismo con las versiones de las actions: todas están fijadas a su major
  # actual y corren en node24. La anterior (`dtolnay/rust-action`) además ya no
  # existe: el repo se renombró a `rust-toolchain`.
  prepare:
    name: Detectar cambio de versión
    runs-on: ubuntu-24.04
    outputs:
      release: ${{ steps.check.outputs.release }}
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
    steps:
      # `fetch-depth: 0` es OBLIGATORIO: sin el historial completo no hay tags y
      # la comparación contra el último tag da siempre "no hay ninguno", lo que
      # haría publicar una release en cada push.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: check
        name: Comparar versión con el último tag
        run: |
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          TAG="v$VERSION"
          # `--sort=-v:refname` ordena por versión, no lexicográficamente:
          # sin esto "v1.9.0" sería "mayor" que "v1.10.0".
          LATEST=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          echo "version en tauri.conf.json : $VERSION"
          echo "ultimo tag de release      : ${LATEST:-(ninguno)}"

          if [ -z "$LATEST" ] || [ "$TAG" != "$LATEST" ]; then
            echo "Hay cambio de versión: se publica $TAG"
            echo "release=true" >> "$GITHUB_OUTPUT"
          else
            echo "La versión no cambió: no se publica nada"
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Crear y subir el tag
        if: steps.check.outputs.release == 'true'
        run: |
          # Si el tag ya existe (disparo manual, o push duplicado) se REUTILIZA.
          # Reintentarlo con `git tag` abortaría el pipeline entero.
          if git rev-parse "refs/tags/${{ steps.check.outputs.tag }}" >/dev/null 2>&1; then
            echo "El tag ${{ steps.check.outputs.tag }} ya existe: se reutiliza"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.check.outputs.tag }}"
          git push origin "${{ steps.check.outputs.tag }}"

  # ── Release ──
  #
  # Se crea ANTES de compilar a propósito: si un build falla, la release ya
  # existe con las notas de cambios y se puede re-subir el artefacto. Al revés,
  # un build fallido dejaría una release sin nada.
  create-release:
    name: Crear release
    needs: prepare
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: ${{ needs.prepare.outputs.tag }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Windows ──
  build-windows:
    name: Compilar Windows
    needs: [prepare, create-release]
    if: needs.prepare.outputs.release == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm ci

      # Vite INLINEA estas variables en el bundle al compilar. Sin ellas el
      # ejecutable sale con el `client_id` de Google vacío y tanto el Sign-In
      # como Drive fallan en la release publicada.
      - name: Build Windows App
        run: npm run tauri build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_D1_WORKER_URL: ${{ secrets.VITE_D1_WORKER_URL }}

      - name: Upload Windows Artifacts to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
          tag_name: ${{ needs.prepare.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ── Android ──
  build-android:
    name: Compilar Android
    needs: [prepare, create-release]
    if: needs.prepare.outputs.release == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # Comprobación ANTES de instalar NDK: si el andamiaje de Gradle faltara,
      # el error real de Gradle es "Directory ... does not contain a Gradle
      # build", que no dice que el problema es que el repo no trae el proyecto.
      # Fallar acá con un mensaje claro ahorra la descarga del NDK (~2 GB) y
      # deja el log entendible.
      - name: Verificar proyecto Gradle
        run: |
          set -e
          G=src-tauri/gen/android
          FALTAN=""
          for f in settings.gradle build.gradle.kts gradle.properties buildSrc/build.gradle.kts; do
            [ -f "$G/$f" ] || FALTAN="$FALTAN $f"
          done
          if [ -n "$FALTAN" ]; then
            echo "::error::Falta el andamiaje de Gradle en $G:$FALTAN"
            echo "::error::Se versiona a proposito (ver .gitignore). Si agregaste una"
            echo "::error::regla que lo ignora, el build de Android no puede compilar en CI."
            exit 1
          fi
          echo "Andamiaje de Gradle presente."

      # NDK explícito. `build.gradle.kts` no declara `ndkVersion`, así que el
      # Android Gradle Plugin descarga la que él quiera: funciona, pero cada
      # runner puede agarrar una distinta y los fallos de link aparecen sin
      # relación con el cambio que los provocar. Fijarla hace la compilación
      # reproducible y más rápida (queda cacheada).
      - name: Install Android NDK and CMake
        run: sdkmanager "ndk;26.1.10909125" "cmake;3.22.1"
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}

      - name: Install Rust stable & Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android, armv7-linux-androideabi, i686-linux-android, x86_64-linux-android

      - name: Install dependencies
        run: npm ci

      # ⚠️ El keystore BINARIO NO está en el repo: se purgó del historial (un
      # keystore de release versionado permite firmar updates falsos; ver la
      # nota en `.gitignore`). Hay que reconstruirlo en el runner desde
      # `KEYSTORE_BASE64`.
      #
      # ⚠️ NO alcanza con `keystore.properties` solo, y el fallo que produce es
      # ENGAÑOSO: `build.gradle.kts` crea `signingConfigs.release` con solo
      # comprobar que exista el `.properties`, y ahí apunta a `keimer.keystore`.
      # Si el archivo no existe, AGP revienta en `:app:validateSigningRelease`
      # con "Keystore file not found for signing config 'release'", y el CLI de
      # Tauri solo imprime `failed to build APK: Failed to assemble APK with
      # Io(BeforeSpawn(...))` — el mensaje NO menciona el keystore por ningún
      # lado. (Sin `.properties` el build sí pasa, pero el APK sale sin firmar.)
      #
      # Para generar el valor del secret en la máquina de desarrollo:
      #   [Convert]::ToBase64String([IO.File]::ReadAllBytes(
      #     "src-tauri\gen\android\app\keimer.keystore"))
      # Debe ser una sola línea; `printf` evita el salto final.
      - name: Reconstruir el keystore de firma
        run: |
          set -e
          printf '%s' "$KEYSTORE_BASE64" | base64 -d \
            > src-tauri/gen/android/app/keimer.keystore
          # Falla con un mensaje claro si el secret no está creado o está vacío,
          # en vez de dejar que lo haga AGP con el error opaco de arriba.
          test -s src-tauri/gen/android/app/keimer.keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}

      # `keystore.properties` está en el .gitignore de `gen/android` (contiene
      # contraseñas), así que no existe en el runner. `build.gradle.kts` lo lee
      # con `?: ""`, o sea que sin este paso `storeFile` queda vacío y el
      # APK release sale sin firmar: no instala, y aunque instale, la
      # actualización sobre una versión firmada con otra clave falla.
      - name: Reconstruir credenciales de firma
        run: |
          cat > src-tauri/gen/android/app/keystore.properties <<EOF
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          storeFile=keimer.keystore
          EOF

      # NO invocar `./gradlew assembleRelease` directo: falla con
      # "A problem occurred starting process 'npm.bat'" porque el PATH que
      # Gradle hereda no incluye npm. Hay que pasar por el CLI de Tauri, que
      # arma el PATH y corre el bundling completo.
      - name: Build Android App (APK / AAB)
        run: npm run tauri android build
        env:
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
          VITE_GOOGLE_CLIENT_SECRET: ${{ secrets.VITE_GOOGLE_CLIENT_SECRET }}
          VITE_D1_WORKER_URL: ${{ secrets.VITE_D1_WORKER_URL }}

      - name: Upload Android Artifacts to Release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            src-tauri/gen/android/app/build/outputs/apk/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/release/*.aab
          tag_name: ${{ needs.prepare.outputs.tag }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}