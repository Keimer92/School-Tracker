[package]
name = "school-tracker"
version = "1.1.1"
description = "School Tracker"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "school_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Tauri la usa para decidir si el binario embebe `frontendDist` o usa
# `devUrl` (ver `tauri-codegen`: `dev: cfg!(not(feature = "custom-protocol"))`).
# `npm run tauri build` la activa sola; un `cargo build` a secas NO, y entonces
# el binario intenta cargar http://localhost:1420 en vez de los assets embebidos.
# Sin esta seccion, `tauri build` falla con "feature custom-protocol not found".
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
tauri = { version = "2", features = [] }
jni = "0.21"
ndk-context = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
ureq = { version = "2.9", features = ["json"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22.1"
url = "2"

# ELIMINADOS 2026-10 (proveedor de nube retirado, ya no se usan):
#   sqlx    -> cliente Postgres de Supabase. 0 referencias en src/.
#   futures -> lo usaban los servicios de sync viejos (Supabase/Turso/
#              PocketBase). El sync actual es Cloudflare D1 con `ureq`
#              (bloqueante, dentro de spawn_blocking) mas WebSocket con tokio.

