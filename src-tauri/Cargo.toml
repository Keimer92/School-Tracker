[package]
name = "school-tracker"
version = "1.1.8"
description = "School Tracker"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "school_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# Tauri la usa para decidir si el binario embebe `frontendDist` o usa
# `devUrl` (ver `tauri-codegen`: `dev: cfg!(not(feature = "custom-protocol"))`).
# `npm run tauri build` la activa sola; un `cargo build` a secas NO, y entonces
# el binario intenta cargar http://localhost:1420 en vez de los assets embebidos.
# Sin esta seccion, `tauri build` falla con "feature custom-protocol not found".
custom-protocol = ["tauri/custom-protocol"]

[dependencies]
# `devtools` NO es un feature por defecto de Tauri (su lista `default` es
# `wry, compression, common-controls-v6, dynamic-acl, x11, dbus`).
#
# Los métodos `open_devtools` / `close_devtools` / `is_devtools_open` de
# `WebviewWindow` están detrás de `#[cfg(any(debug_assertions,
# feature = "devtools"))]`. En `cargo check` (dev) pasan porque `debug_assertions`
# está activo; en `cargo build --release` —que es lo que corre CI—
# `debug_assertions` se apaga y los métodos DESAPARECEN, con un E0599 que
# apunta al uso pero no a la causa.
#
# Se activa a propósito en release: el flujo de diagnóstico de este proyecto
# depende de DevTools (los `console.warn` de [Welcome]/[Drive]/[D1] se leen en
# la consola del WebView en la app instalada, y DevTools oculta `console.debug`
# salvo nivel "Verbose"). Sin DevTools en release no hay forma de diagnosticar
# un problema de un usuario real.
tauri = { version = "2", features = ["devtools"] }
jni = "0.21"
ndk-context = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
chrono = { version = "0.4", features = ["serde"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
ureq = { version = "2.9", features = ["json"] }
tokio = { version = "1", features = ["full"] }
base64 = "0.22.1"
url = "2"

# ELIMINADOS 2026-10 (proveedor de nube retirado, ya no se usan):
#   sqlx    -> cliente Postgres de Supabase. 0 referencias en src/.
#   futures -> lo usaban los servicios de sync viejos (Supabase/Turso/
#              PocketBase). El sync actual es Cloudflare D1 con `ureq`
#              (bloqueante, dentro de spawn_blocking) mas WebSocket con tokio.

